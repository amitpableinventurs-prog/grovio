<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Grovio Hub Check-in</title>
<style>
  :root { --brand-50: #eefdf3; --brand-700: #126e40; --text: #1f2937; --muted: #6b7280; --bg: #f6f8f7; --surface: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --brand-50: #0f2a1c; --brand-700: #7be3a8; --text: #e8eeeb; --muted: #95a39c; --bg: #0c1210; --surface: #151d1a; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px;
    background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card { width: 100%; max-width: 420px; background: var(--surface); border-radius: 20px; padding: 32px 28px; text-align: center; }
  .icon { width: 56px; height: 56px; border-radius: 50%; background: var(--brand-50); color: var(--brand-700); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0; }
</style>
</head>
<body>
  <!-- Opened when a hub screen's check-in QR is scanned with a plain camera app. The code only
       works when scanned from inside the Delivery app (POST /api/v1/delivery/hub/checkin), which
       adds the partner's own login — this page never submits it. -->
  <div class="card">
    <div class="icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>
    </div>
    <h1>Scan from the Grovio Delivery app</h1>
    <p>This is a hub check-in code. Open the Grovio Delivery app, go to <strong>Hub check-in</strong> and scan the code on the hub screen from there.</p>
  </div>
</body>
</html>
