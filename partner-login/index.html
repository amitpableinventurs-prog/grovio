<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grovio Partner Login</title>
<style>
  :root {
    --brand-50: #eefdf3; --brand-100: #d6f7e0; --brand-200: #b0edc6; --brand-300: #7bdda4;
    --brand-400: #45c67d; --brand-500: #22ab61; --brand-600: #158a4d; --brand-700: #126e40;
    --brand-800: #125736; --brand-900: #10482e;
    --text: #1f2937; --muted: #6b7280; --border: #e5e7eb; --bg: #f6f8f7; --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 32px 16px;
  }
  .card {
    width: 100%; max-width: 420px; background: #fff; border-radius: 20px;
    box-shadow: 0 1px 2px rgba(16,72,46,0.04), 0 20px 40px -12px rgba(16,72,46,0.18);
    padding: 36px 32px;
  }
  .brand-mark { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 800; color: var(--brand-700); margin-bottom: 22px; }
  h2 { font-size: 20px; margin: 0 0 4px; font-weight: 700; }
  p.lede { color: var(--muted); font-size: 13.5px; margin: 0 0 22px; line-height: 1.5; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .field { margin-top: 14px; }
  .field:first-child { margin-top: 0; }
  input {
    width: 100%; padding: 10px 13px; border: 1.5px solid var(--border); border-radius: 10px;
    font-size: 14px; font-family: inherit; background: #fafbfa; transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  }
  input:focus { outline: none; border-color: var(--brand-500); background: #fff; box-shadow: 0 0 0 3px rgba(21,138,77,0.14); }
  button[type="submit"] {
    width: 100%; padding: 13px; background: var(--brand-600); color: #fff; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 18px; transition: background 0.15s, transform 0.1s;
  }
  button[type="submit"]:hover { background: var(--brand-700); }
  button[type="submit"]:active { transform: scale(0.99); }
  button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }
  .link-btn { background: none; border: none; color: var(--brand-700); font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 0; margin-top: 14px; }
  .alert { border-radius: 10px; padding: 12px 14px; font-size: 13px; margin-bottom: 18px; line-height: 1.5; display: none; }
  .alert.error { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
  .alert.info { background: var(--brand-50); color: var(--brand-800); border: 1px solid var(--brand-200); }
  .success-view { display: none; }
  .success-icon { width: 56px; height: 56px; border-radius: 50%; background: var(--brand-50); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
  .success-view h2 { text-align: center; }
  .status-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
  .status-badge.approved { background: var(--brand-50); color: var(--brand-700); }
  .status-badge.pending { background: #fffbeb; color: #b45309; }
  .status-badge.blocked { background: #fef2f2; color: var(--danger); }
  .info-row { display: flex; justify-content: space-between; font-size: 13.5px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .info-row:last-child { border-bottom: none; }
  .info-row span:first-child { color: var(--muted); }
  .token-box {
    margin-top: 16px; padding: 10px 12px; background: #f8fafc; border: 1px solid var(--border); border-radius: 8px;
    font-size: 11px; font-family: ui-monospace, monospace; word-break: break-all; color: var(--muted); max-height: 70px; overflow-y: auto;
  }
  .token-label { font-size: 11px; font-weight: 700; color: var(--text); margin-top: 12px; margin-bottom: 4px; }
  .pending-note { margin-top: 16px; padding: 12px 14px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; font-size: 12.5px; color: #92400e; line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand-mark">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Grovio Partner Login
    </div>

    <div id="form-view">
      <h2>Picker / Delivery Login</h2>
      <p class="lede">Log in with the mobile number you registered with.</p>

      <div id="alert" class="alert"></div>

      <form id="phone-form">
        <div class="field">
          <label for="phone">Mobile Number (+91)</label>
          <input id="phone" name="phone" type="tel" required autocomplete="tel-national" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" title="10-digit mobile number" placeholder="9876543210" />
        </div>
        <button type="submit" id="send-otp-btn">Send OTP</button>
      </form>

      <form id="otp-form" style="display:none">
        <div class="field">
          <label for="otp">Enter the 4-digit code sent to <span id="otp-phone-label"></span></label>
          <input id="otp" name="otp" type="text" inputmode="numeric" maxlength="4" required autocomplete="one-time-code" style="letter-spacing:6px;font-size:20px;text-align:center" />
        </div>
        <button type="submit" id="verify-otp-btn">Log In</button>
        <button type="button" class="link-btn" id="back-btn">&larr; Change number</button>
      </form>
    </div>

    <div id="success-view" class="success-view">
      <div class="success-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#158a4d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h2>Logged in</h2>
      <div class="info-row"><span>Name</span><span id="info-name"></span></div>
      <div class="info-row"><span>Role</span><span id="info-role"></span></div>
      <div class="info-row"><span>Status</span><span id="info-status"></span></div>
      <div id="pending-note" class="pending-note" style="display:none">
        Your account is still pending admin approval — you won't be able to accept jobs until then.
      </div>
      <div class="token-label">Access token (for API testing)</div>
      <div class="token-box" id="token-box"></div>
    </div>
  </div>

  <script>
    const phoneForm = document.getElementById('phone-form');
    const otpForm = document.getElementById('otp-form');
    const alertBox = document.getElementById('alert');
    const sendOtpBtn = document.getElementById('send-otp-btn');
    const verifyOtpBtn = document.getElementById('verify-otp-btn');
    const backBtn = document.getElementById('back-btn');

    function showAlert(message, type) {
      alertBox.textContent = message;
      alertBox.className = `alert ${type}`;
      alertBox.style.display = 'block';
    }
    function hideAlert() { alertBox.style.display = 'none'; }

    backBtn.addEventListener('click', () => {
      otpForm.style.display = 'none';
      phoneForm.style.display = 'block';
      hideAlert();
    });

    phoneForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      sendOtpBtn.disabled = true;
      sendOtpBtn.textContent = 'Sending OTP…';

      const phone = phoneForm.phone.value.trim();
      try {
        const res = await fetch('/api/v1/auth/send-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone }),
        });
        const body = await res.json();
        if (!res.ok || !body.success) throw new Error(body.message || 'Could not send OTP. Please try again.');

        document.getElementById('otp-phone-label').textContent = `+91 ${phone}`;
        phoneForm.style.display = 'none';
        otpForm.style.display = 'block';
        if (body.data && body.data.debugOtp) {
          document.getElementById('otp').value = body.data.debugOtp;
          showAlert(`Dev mode: OTP auto-filled (${body.data.debugOtp}).`, 'info');
        }
      } catch (err) {
        showAlert(err.message || 'Something went wrong. Please try again.', 'error');
      } finally {
        sendOtpBtn.disabled = false;
        sendOtpBtn.textContent = 'Send OTP';
      }
    });

    otpForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      verifyOtpBtn.disabled = true;
      verifyOtpBtn.textContent = 'Verifying…';

      try {
        const res = await fetch('/api/v1/auth/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: phoneForm.phone.value.trim(), otp: otpForm.otp.value.trim() }),
        });
        const body = await res.json();
        if (!res.ok || !body.success) throw new Error(body.message || 'Login failed. Please try again.');

        const { accessToken, user } = body.data;

        document.getElementById('info-name').textContent = user.name || '—';
        document.getElementById('info-role').textContent = user.role;
        document.getElementById('token-box').textContent = accessToken;

        // Look up approval status from the role-specific profile — the User record itself
        // doesn't carry it.
        let status = null;
        if (user.role === 'picker' || user.role === 'delivery') {
          try {
            const profileRes = await fetch(`/api/v1/${user.role}/profile`, {
              headers: { Authorization: `Bearer ${accessToken}` },
            });
            const profileBody = await profileRes.json();
            if (profileRes.ok && profileBody.success) status = profileBody.data.status;
          } catch (_) { /* best-effort — login already succeeded either way */ }
        }

        const statusLabel = document.getElementById('info-status');
        if (status) {
          statusLabel.innerHTML = `<span class="status-badge ${status}">${status}</span>`;
          document.getElementById('pending-note').style.display = status === 'pending' ? 'block' : 'none';
        } else {
          statusLabel.textContent = '—';
        }

        document.getElementById('form-view').style.display = 'none';
        document.getElementById('success-view').style.display = 'block';
      } catch (err) {
        showAlert(err.message || 'Something went wrong. Please try again.', 'error');
      } finally {
        verifyOtpBtn.disabled = false;
        verifyOtpBtn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
